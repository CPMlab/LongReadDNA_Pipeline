# Configuration for the long-read cancer genome workflow
# Small files shipped with this repository live in scripts/ and resources/;
# large reference data (genome, VEP cache, containers, AnnotSV, Mitelman) must be prepared under resource/ (gitignored).
# Sample information is read from samples_file.

# Sample sheet
samples_file: "samples.tsv"  # TSV with patient_id, sample_type, bam_path columns

# Reference files
reference_fasta: "resource/ref/GCA_000001405.15_GRCh38_no_alt_analysis_set_maskedGRC_exclusions_v2.fasta"  # reference genome
vep_cache: "resource/vep_cache/homo_sapiens_refseq_vep_112_GRCh38.tar.gz"          # VEP annotation cache
vntr_bed: "resource/severus/human_GRCh38_no_alt_analysis_set.trf.bed"  # VNTR BED for Severus
compendium_file: "resource/intogen_genelist/Compendium_Cancer_Genes_2024-9-30.tsv"  # IntOGen Compendium of Cancer Genes
annotsv_cache: "resource/annotsv/annotsv_cache.tar.gz"  # AnnotSV annotation cache

# Container images
clair3_container: "resource/container/clair3_latest.sif"        # Clair3
deepsomatic_container: "resource/container/deepsomatic_1.8.0.sif"  # DeepSomatic
savana_container: "resource/container/savana_1.3.4.sif"        # SAVANA
wakhan_container: "resource/container/wakhan_latest.sif"        # Wakhan

# Compute resources
# Keep these at or below the cores of a single compute node, and within any per-user limit
# your scheduler enforces (SLURM QoS/association, SGE slots). A rule asking for more cores
# than a node has will never be scheduled: the job simply waits forever without an error.
# Raise them to match your hardware; the defaults are deliberately modest.
threads: 32                  # threads for heavy rules (alignment, Clair3, DeepSomatic, HiPhase, Severus)
threads_low: 8               # threads for light rules

# Output directory
output_dir: "results"        # where results are written

# Structural variant resources
contig_bed: "resources/chr.bed"  # contigs to keep
svpack_script: "scripts/svpack.py"  # bundled SVpack script
mitelman_mcgene: "resource/circos/mitel"  # Mitelman database MCGENE dump
circos_config: "resources/hg38.bed"  # circos genome bed
cytoband_file: "resources/hg38_cytoband.tsv"  # cytoband table

#SVPACK
reference_gff: "resource/svpack/Homo_sapiens.GRCh38.112.chr.reformatted.gff3"
svpack_match_vcf: "resource/svpack/severus.jasmine.AN10.AC4.nosample.vcf.gz"

# Methylation
methylation_min_coverage: 5   # minimum coverage
methylation_min_mapq: 1       # minimum mapping quality

# Copy number
# SAVANA
savana_min_supp: 3             # minimum supporting reads
savana_min_af: 0.05            # minimum allele frequency
savana_svlength: 50            # minimum SV length

# Wakhan  
wakhan_purity_range: "0.2-1.0"  # purity search range
wakhan_ploidy_range: "1-6"      # ploidy search range

# DSS differential methylation
dss_smoothing: true          # apply smoothing
dss_delta: 0.1              # minimum methylation difference
dss_pvalue: 0.01            # p-value threshold


# ---------------------------------------------------------------------------
# PURPLE (HMFtools) — purity / ploidy / allele-specific CNV
# See docs/INSTALLATION.md for how to obtain the jars and the resource bundle.
# ---------------------------------------------------------------------------
amber_jar: "resource/purple/amber-4.0-jar-with-dependencies.gamma1000.jar"
cobalt_jar: "resource/purple/cobalt-1.16.0-jar-with-dependencies.jar"
purple_jar: "resource/purple/purple-4.0-jar-with-dependencies.jar"
hmf_resources_tarball: "resource/purple/hmf_pipeline_resources.38_v2.0.0--3.tar.gz"

purple_java_mem: "60G"       # java -Xmx for the HMFtools jars
cobalt_pcf_gamma: 1000       # Cobalt segmentation gamma
purple_min_purity: 0.08
purple_max_purity: 0.99
purple_min_ploidy: 1
purple_max_ploidy: 8

# ---------------------------------------------------------------------------
# Biomarkers (HRD / mutational signatures / MSI / TMB)
# ---------------------------------------------------------------------------
chord_container: "resource/container/chord.sif"                      # HRD prediction
somatic_r_tools_container: "resource/container/somatic_r_tools.sif"   # MutationalPatterns
owl_container: "resource/container/owl.sif"                          # MSI
tmb_container: "resource/container/tmb_calculator.sif"               # TMB

mutsig_max_delta: 0.004      # MutationalPatterns bootstrap max delta
msi_min_depth: 5             # owl score minimum depth
tmb_min_depth: 10            # TMB: minimum variant depth
tmb_min_coverage: 10         # TMB: minimum region coverage
tmb_min_vaf: 0.10            # TMB: minimum VAF
tmb_gnomad_max_af: 0.01      # TMB: drop variants above this gnomAD AF
