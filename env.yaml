name: long_read_pipeline
channels:
  - bioconda
  - conda-forge
  - r
  - defaults
dependencies:
  - python=3.8.20
  - snakemake=7.32.4
  
  # 매핑 및 기본 도구들
  - pbmm2=1.16.0
  - samtools=1.19.2
  - mosdepth=0.3.3
  - bcftools=1.18
  - htslib=1.19.1
  - minimap2=2.26
  
  # 위상결정 및 변이 검출
  - hiphase=1.5.0
  - severus=1.4
  
  # 메틸화 분석 도구
  - pb-cpg-tools  # aligned_bam_to_cpg_scores 포함
  
  # VEP 및 주석 도구
  - ensembl-vep=113.4
  - annotsv=3.4.6
  
  # 유틸리티 도구들
  - csvtk=0.31.0
  - singularity=3.8.6
  - gawk=5.3.1
  - perl=5.32.1
  - perl-compress-raw-zlib>=2.201
  - boost=1.74.0
  - zlib=1.2.13
  
  # Python 패키지들
  - pandas
  - pycirclize
  
  # R 및 R 패키지들
  - r-base=4.2.3
  - r-essentials
  - bioconductor-dss
  - bioconductor-annotatr
  - bioconductor-genomicranges
  - bioconductor-rtracklayer
  - r-dplyr
  - r-readr
  - r-ggplot2